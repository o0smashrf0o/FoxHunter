<section class="tab-pane active" id="tab-wifi">
  <div class="panel">
    <h2>Wi‑Fi survey</h2>
    <div class="acq-strip" id="wifi-acq">
      <div class="acq-cell"><span class="k">Contacts</span><span class="v" id="wifi-acq-count">0</span></div>
      <div class="acq-cell"><span class="k">Adapter</span><span class="v" id="wifi-acq-iface">—</span></div>
      <div class="acq-cell"><span class="k">Strongest</span><span class="v" id="wifi-acq-best">—</span></div>
    </div>
    <div class="row">
      <label class="muted">Source
        <select id="wifi-source"></select>
      </label>
      <button class="primary" type="button" onclick="scanWifi()">Scan</button>
      <span class="tip-wrap" id="wifi-cont-wrap">
        <button type="button" id="wifi-continuous" disabled onclick="toggleWifiContinuous()">Continuous</button>
        <span class="tip" id="wifi-cont-tip">Select a dongle here, start Kismet on the Kismet tab, then Continuous. Scan works without Kismet. Continuous needs Kismet and uses this dongle as the source.</span>
      </span>
      <button type="button" onclick="clearDevices('wifi')">Clear</button>
      <span id="wifi-status" class="muted"></span>
    </div>
    <div class="row" style="align-items:center;padding-top:0.5rem;">
      <span class="muted" id="wifi-pcap-status">Idle</span>
      <button class="secondary" type="button" id="wifi-pcap-toggle" disabled onclick="toggleWifiPcap()">PCap</button>
      <span class="muted" id="wifi-pcap-file" style="margin-left:1rem;"></span>
    </div>
    <div class="table-wrap">
      <table class="grid" id="wifi-table">
        <thead>
          <tr><th>SSID</th><th>BSSID</th><th>RSSI</th><th>Ch</th><th>Enc</th><th>Vendor</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>
